<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="fwTitle fwDesc">
  <title id="fwTitle">汉化补丁的工作流程</title>
  <desc id="fwDesc">读取官方 exe，拆开内嵌资源包 .pck，用翻译表替换三处来源的界面字符串，再按 16 字节对齐重新封包，输出可运行的汉化版 exe。</desc>

  <rect width="1200" height="420" rx="24" fill="#0B0F14"/>

  <text x="56" y="62" font-size="18" letter-spacing="2.4" fill="#8B98A5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">// 工作原理</text>
  <text x="56" y="102" font-size="28" font-weight="700" fill="#E6EDF3"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">补丁怎么工作</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- 1 -->
    <rect x="56" y="150" width="184" height="118" rx="14" fill="#131A22" stroke="#22303C" stroke-width="1.5"/>
    <text x="76" y="204" font-size="20" font-weight="600" fill="#E6EDF3">读取官方 exe</text>
    <text x="76" y="234" font-size="17" fill="#8B98A5">官方发布包</text>

    <!-- 2 -->
    <rect x="282" y="150" width="184" height="118" rx="14" fill="#131A22" stroke="#22303C" stroke-width="1.5"/>
    <text x="302" y="204" font-size="20" font-weight="600" fill="#E6EDF3">拆开内嵌 .pck</text>
    <text x="302" y="234" font-size="17" fill="#8B98A5">解出全部资源</text>

    <!-- 3 -->
    <rect x="508" y="150" width="184" height="118" rx="14" fill="#131A22" stroke="#22303C" stroke-width="1.5"/>
    <text x="528" y="204" font-size="20" font-weight="600" fill="#E6EDF3">替换界面字符串</text>
    <text x="528" y="234" font-size="17" fill="#8B98A5">只换文案</text>

    <!-- 4 -->
    <rect x="734" y="150" width="184" height="118" rx="14" fill="#131A22" stroke="#22303C" stroke-width="1.5"/>
    <text x="754" y="204" font-size="20" font-weight="600" fill="#E6EDF3">重新封包回写</text>
    <text x="754" y="234" font-size="17" fill="#8B98A5">16 字节对齐</text>

    <!-- 5 -->
    <rect x="960" y="150" width="184" height="118" rx="14" fill="#10241A" stroke="#1F6F46" stroke-width="1.5"/>
    <text x="980" y="204" font-size="20" font-weight="600" fill="#43B581">汉化版 exe</text>
    <text x="980" y="234" font-size="17" fill="#5FA982">双击即可运行</text>
  </g>

  <!-- 阶段之间的箭头 -->
  <g stroke="#3A4A59" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M248 209 L266 209 M260 203 L266 209 L260 215"/>
    <path d="M474 209 L492 209 M486 203 L492 209 L486 215"/>
    <path d="M700 209 L718 209 M712 203 L718 209 L712 215"/>
    <path d="M926 209 L944 209 M938 203 L944 209 L938 215"/>
  </g>

  <!-- 输入：翻译表与三处字符串来源，喂给第 3 步 -->
  <g stroke="#3D3418" stroke-width="2" fill="none">
    <path d="M600 268 L600 296 M430 296 L770 296"/>
    <path d="M470 296 L470 312 M730 296 L730 312"/>
  </g>
  <rect x="360" y="312" width="480" height="48" rx="12" fill="#1E1A0F" stroke="#3D3418" stroke-width="1.5"/>
  <text x="600" y="343" font-size="18" fill="#E3B341" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">翻译表 translations.py ＋ 三处字符串来源</text>

  <line x1="56" y1="392" x2="1144" y2="392" stroke="#22303C" stroke-width="1.5"/>
</svg>
