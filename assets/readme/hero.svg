<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">BDS Addon Manager 汉化补丁</title>
  <desc id="heroDesc">把官方 BDS Addon Manager.exe 内嵌的界面文案替换成中文的一键补丁工具。右侧示意内嵌资源包里的英文 World Files 被换成中文 世界文件。</desc>

  <rect width="1200" height="360" rx="24" fill="#0B0F14"/>

  <!-- 母题：16 字节对齐标尺，暗示补丁处理的是二进制对齐 -->
  <line x1="64" y1="322" x2="1136" y2="322" stroke="#22303C" stroke-width="1.5"/>
  <line x1="64" y1="322" x2="1136" y2="322" stroke="#43B581" stroke-width="1.5"
        stroke-dasharray="2 14" opacity="0.75"/>

  <!-- 标题区 -->
  <g transform="translate(64 72)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" font-size="18" letter-spacing="2.4" fill="#8B98A5"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GODOT 4.7 · 内嵌资源包补丁</text>
    <text x="0" y="66" font-size="46" font-weight="700" fill="#E6EDF3">BDS Addon Manager 汉化补丁</text>
    <text x="0" y="120" font-size="22" fill="#B9C4CF">不改源码，直接给官方 exe 换上一套中文界面。</text>
    <text x="0" y="156" font-size="22" fill="#B9C4CF">作者更新版本后，重新点一次就能用。</text>

    <g transform="translate(0 202)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B98A5">
      <text x="0" y="0">Python 3.14+</text>
      <circle cx="146" cy="-6" r="3" fill="#2A3946"/>
      <text x="162" y="0">一条命令 / 双击脚本</text>
      <circle cx="392" cy="-6" r="3" fill="#2A3946"/>
      <text x="408" y="0">约 100 条界面文案</text>
    </g>
  </g>

  <!-- 项目本体的材料：内嵌资源包里的字符串替换 -->
  <g transform="translate(812 48)">
    <rect x="0" y="0" width="324" height="252" rx="16" fill="#131A22" stroke="#22303C" stroke-width="1.5"/>

    <text x="24" y="38" font-size="17" fill="#8B98A5"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">res:// 内嵌 .pck 的字符串</text>

    <rect x="24" y="58" width="276" height="52" rx="12" fill="#1B242E" stroke="#2A3946" stroke-width="1.5"/>
    <text x="40" y="92" font-size="22" fill="#8B98A5"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">World Files</text>
    <text x="284" y="92" font-size="16" fill="#5C6B79" text-anchor="end"
          font-family="-apple-system, 'PingFang SC', sans-serif">英文</text>

    <g transform="translate(162 128)">
      <circle r="15" fill="#1E1A0F" stroke="#3D3418" stroke-width="1.5"/>
      <path d="M -6 -5 L -6 5 M -6 5 L -10 1 M -6 5 L -2 1" fill="none" stroke="#E3B341"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 6 5 L 6 -5 M 6 -5 L 2 -1 M 6 -5 L 10 -1" fill="none" stroke="#E3B341"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="24" y="152" width="276" height="52" rx="12" fill="#10241A" stroke="#1F6F46" stroke-width="1.5"/>
    <text x="40" y="186" font-size="22" fill="#43B581"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">世界文件</text>
    <text x="284" y="186" font-size="16" fill="#5C6B79" text-anchor="end"
          font-family="-apple-system, 'PingFang SC', sans-serif">中文</text>

    <text x="24" y="232" font-size="16" fill="#6E7D8B"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">16 字节对齐 · 未改动内容原样保留</text>
  </g>
</svg>
